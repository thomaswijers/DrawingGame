<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style/style.css">
    <script src="https://kit.fontawesome.com/fad29d7515.js" crossorigin="anonymous"></script>
    <script src="scripts/idleReset.js"></script>
    <title>Drawing Canvas</title>
</head>

<body>
    <div class="content-container">
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="post-game-actions" class="btn-container d-none pt-3">
                <a class="btn btn-primary w-100"><i class="fa-solid fa-envelope"></i> Per email sturen</a>
                <a id="btn-print" class="btn btn-primary w-100"><i class="fa-solid fa-print"></i> Print schilderij</a>
            </div>
        </div>

        <div class="toolbar-box">
            <div class="painting-box">
                <figure>
                    <img src="images/vrijheidsmuseum-logo.png" alt="painting" id="painting" />
                </figure>
            </div>
            <div id="toolbar">
                <div id="size-controls">
                </div>

                <div class="timer">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span id="timer">2:00</span>
                </div>

                <!-- Brush colors -->
                <div id="color-controls" class="brush-colors"></div>

                <!-- Actions -->
                <div id="action-controls">
                    <button id="btn-finish" class="btn btn-primary w-100">Klaar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed center bottom-0 end-0 p-3">
        <div id="timesUp" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">Helaas</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body">
                De tijd voor je meesterwerk is om.
            </div>
        </div>
    </div>

    <!-- Hidden iframe used for header/footer-free printing -->
    <iframe id="print-frame"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/painting.js"></script>
</body>

</html>
