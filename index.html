<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/style/style.css">
    <title>Drawing Canvas</title>
</head>

<body>
    <div class="container d-flex align-items-center">
        <div class="content-container d-flex gap-5">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>

            <div class="toolbar-box">
                <div class="painting-box">
                    <figure>    
                        <img src="/images/vrijheidsmuseum-logo.png" alt="painting" id="painting" />
                    </figure>
                    <button id="btn-painting" class="btn btn-success">Get a painting</button>
                </div>
                <div id="toolbar">
                    <!-- Brush sizes -->
                    <div id="size-controls"></div>

                    <!-- Active color -->
                    <div id="active-color-control" class="active-colors">
                        <div id="active-color"></div>
                    </div>

                    <!-- Brush colors -->
                    <div id="color-controls" class="brush-colors"></div>

                    <!-- Extra brush properties land here -->
                    <div id="extra-controls"></div>

                    <!-- Actions -->
                    <div id="action-controls">
                        <button id="btn-clear" class="btn btn-danger">Clear</button>
                        <button id="btn-print" class="btn btn-success">Print drawing</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden iframe used for header/footer-free printing -->
    <iframe id="print-frame"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
